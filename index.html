<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Kufi+Arabic:wght@500;700&display=swap">
<style>
/* Layout concept: single centered column, one decision per screen, wide touch targets, results as stacked sections. */
:root {
  --paper: #F4F2EC;
  --surface: #FFFFFF;
  --ink: #14243D;
  --ink-2: #4B5C6B;
  --line: #DDD6C5;
  --accent: #142B4A;
  --accent-ink: #FFFFFF;
  --accent-soft: #F3E8C9;
  --gold: #C49A3A;
  --gold-deep: #A77B20;
  --gold-ink: #172B46;
  --alert: #7D5410;
  --alert-soft: #F7EEDC;
  --font-display: 'Noto Kufi Arabic', 'IBM Plex Sans Arabic', Tahoma, sans-serif;
  --font-body: 'IBM Plex Sans Arabic', Tahoma, 'Segoe UI', sans-serif;
  --radius: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111D2D; --surface: #1A2A40; --ink: #F2F4F7; --ink-2: #B9C3D0; --line: #34465D;
    --accent: #D0A849; --accent-ink: #172B46; --accent-soft: #3A3427; --gold: #D0A849; --gold-deep: #E0BD6B; --gold-ink: #172B46; --alert: #E4B96C; --alert-soft: #302819;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111D2D; --surface: #1A2A40; --ink: #F2F4F7; --ink-2: #B9C3D0; --line: #34465D;
  --accent: #D0A849; --accent-ink: #172B46; --accent-soft: #3A3427; --gold: #D0A849; --gold-deep: #E0BD6B; --gold-ink: #172B46; --alert: #E4B96C; --alert-soft: #302819;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 17px; line-height: 1.75;
  direction: rtl;
  padding-block: 18px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.shell { max-width: 760px; margin-inline: auto; display: flex; flex-direction: column; gap: 22px; }
h1, h2, h3 { font-family: var(--font-display); line-height: 1.5; margin: 0; text-wrap: balance; color: var(--ink); }
h1 { font-size: clamp(1.5rem, 4.6vw, 2rem); font-weight: 700; }
h2 { font-size: 1.15rem; font-weight: 700; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
[tabindex="-1"]:focus { outline: none; }

.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 700; font-size: 1.25rem; color: var(--ink); background: none; border: 0; padding: 4px; cursor: pointer; }
.brand svg { width: 30px; height: 30px; }
.pill { font-size: 0.82rem; padding: 4px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-weight: 600; border: 1px solid var(--gold); }

.view { display: flex; flex-direction: column; gap: 22px; animation: rise .22s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .view { animation: none; } * { transition: none !important; } }

.lead { color: var(--ink-2); font-size: 1.05rem; max-width: 60ch; }
.stack { display: flex; flex-direction: column; gap: 14px; }

.btn {
  font: inherit; font-weight: 600; min-height: 58px; padding: 12px 20px; border-radius: var(--radius);
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  display: flex; align-items: center; justify-content: space-between; gap: 14px; text-align: start; width: 100%;
  transition: border-color .15s, background .15s;
}
.btn:hover { border-color: var(--accent); }
.btn small { display: block; font-weight: 400; color: var(--ink-2); font-size: 0.9rem; line-height: 1.5; margin-top: 2px; }
.btn-primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); box-shadow: 0 4px 12px rgba(20,43,74,.10); }
.btn-primary small { color: var(--gold-ink); opacity: .9; }
.btn-primary:hover { border-color: var(--gold-deep); background: var(--gold-deep); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.btn .arrow { flex: none; width: 22px; height: 22px; }
.btn-inline { width: auto; justify-content: center; min-height: 50px; }
.link { background: none; border: 0; padding: 6px 2px; font: inherit; color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 4px; align-self: flex-start; }
.back { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; padding: 6px 2px; font: inherit; color: var(--ink-2); cursor: pointer; align-self: flex-start; }
.back:hover { color: var(--ink); }

.home-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.home-tile { min-height:105px; background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:15px; display:flex; flex-direction:column; justify-content:space-between; gap:8px; text-decoration:none; color:var(--ink); cursor:pointer; font:inherit; text-align:right; }
.home-tile strong {font-family:var(--font-display);font-size:1rem;color:var(--accent)}
.home-tile {border-top:3px solid var(--gold)}
.summary-highlight {background:linear-gradient(135deg,var(--accent),#203E63);color:#fff;border:1px solid var(--gold);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:10px}
.summary-highlight h2,.summary-highlight strong {color:#F2D58B}
.summary-highlight p {color:#fff}
.answer-list {display:flex;flex-direction:column;gap:10px}
.answer-item {border-bottom:1px solid var(--line);padding:8px 0}
.answer-item:last-child {border-bottom:0}
.answer-item strong {display:block;color:var(--ink-2);font-size:.9rem;margin-bottom:3px}
.answer-item span {display:block;color:var(--ink);font-weight:600}
.home-tile small {color:var(--ink-2);font-size:.85rem}
.searchbox {display:flex;gap:8px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:15px;padding:8px 12px}
.searchbox input {flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;padding:8px}
.section-head {display:flex;align-items:center;justify-content:space-between;gap:10px}
.chips {display:flex;flex-wrap:wrap;gap:8px}
.chip {border:1px solid var(--line);border-radius:999px;padding:7px 12px;background:var(--surface);color:var(--ink);font:inherit;cursor:pointer}
.cats { display: grid; grid-template-columns: 1fr; gap: 12px; }
@media (min-width: 600px) { .cats { grid-template-columns: 1fr 1fr; } }

.progress { display: flex; flex-direction: column; gap: 8px; }
.progress-meta { display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--ink-2); gap: 12px; flex-wrap: wrap; }
.track { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.fill { height: 100%; background: var(--gold); border-radius: 999px; transition: width .3s ease; }

.qcard { background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: clamp(18px, 4vw, 30px); display: flex; flex-direction: column; gap: 20px; }
.help { color: var(--ink-2); font-size: 0.95rem; }
.opt { gap: 14px; justify-content: flex-start; font-weight: 500; }
.opt .dot { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); }
.opt:hover .dot { border-color: var(--accent); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .dot { border-color: var(--accent); background: radial-gradient(var(--accent) 45%, transparent 50%); }

textarea {
  font: inherit; width: 100%; min-height: 260px; resize: vertical; padding: 16px; line-height: 1.8;
  border-radius: var(--radius); border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); direction: rtl;
}
textarea:focus { border-color: var(--accent); outline: 3px solid var(--accent-soft); }
.counter { font-size: 0.88rem; color: var(--ink-2); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; min-height: 1.6em; }
.err { color: var(--alert); }
details.tips { background: var(--surface); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 12px 16px; }
details.tips summary { cursor: pointer; font-weight: 600; }
details.tips ul { margin: 10px 0 2px; padding-inline-start: 22px; color: var(--ink-2); }

.notice { background: var(--alert-soft); color: var(--alert); border-radius: var(--radius); padding: 14px 16px; font-size: 0.95rem; line-height: 1.7; }
.demo-note { background: var(--accent-soft); color: var(--ink); border-radius: var(--radius); padding: 12px 16px; font-size: 0.92rem; color: var(--ink-2); }

.sec { background: var(--surface); border: 1.5px solid var(--line); border-radius: 18px; padding: clamp(18px, 4vw, 26px); display: flex; flex-direction: column; gap: 12px; }
.sec ul, .sec ol { margin: 0; padding-inline-start: 22px; display: flex; flex-direction: column; gap: 8px; }
.sec li::marker { color: var(--gold-deep); }
.sec .sub { font-size: 0.92rem; color: var(--ink-2); }
.quote { border-inline-start: 4px solid var(--accent); padding: 4px 14px; color: var(--ink-2); background: var(--paper); border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; }
.class-main { font-size: 1.15rem; font-weight: 700; color: var(--accent); border-inline-start: 4px solid var(--gold); padding-inline-start: 12px; }
.missing li { list-style: none; position: relative; padding-inline-start: 4px; }
.missing { padding-inline-start: 0 !important; }
.missing li::before { content: "؟"; display: inline-block; width: 1.5em; font-weight: 700; color: var(--accent); }
.check { display: flex; gap: 12px; align-items: flex-start; padding: 10px 12px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
.check:hover { background: var(--paper); }
.check input { width: 22px; height: 22px; margin: 3px 0 0; accent-color: var(--accent); flex: none; }
.checks { display: flex; flex-direction: column; gap: 2px; }
.disclaimer { border: 2px solid var(--alert); border-radius: 18px; padding: clamp(18px, 4vw, 26px); background: var(--alert-soft); color: var(--ink); display: flex; flex-direction: column; gap: 8px; }
.disclaimer h2 { color: var(--alert); }
.actions { display: flex; gap: 12px; flex-wrap: wrap; }
.loading { display: flex; flex-direction: column; align-items: center; gap: 16px; padding: 60px 0; color: var(--ink-2); }
.spin { width: 38px; height: 38px; border-radius: 50%; border: 4px solid var(--line); border-top-color: var(--accent); animation: spin 0.9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
@media print { body { background:#fff !important; color:#142B4A !important; padding:0 !important; } .topbar,.actions,.back,.disclaimer { break-inside:avoid; } .btn,.back,.pill { display:none !important; } .shell { max-width:none; } .view { animation:none; } .sec,.summary-highlight { break-inside:avoid; box-shadow:none; } .summary-highlight { background:#142B4A !important; print-color-adjust:exact; -webkit-print-color-adjust:exact; } }
</style>

<div id="app" dir="rtl" lang="ar">
  <div class="shell">
    <header class="topbar">
      <button class="brand" type="button" data-action="home" aria-label="العودة إلى الصفحة الرئيسية">
        <svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--accent)">
          <path d="M16 4v22M9 27h14M6 10h20"/><path d="M6 10l-3.5 8a4 4 0 0 0 7 0L6 10zM26 10l-3.5 8a4 4 0 0 0 7 0L26 10z"/>
        </svg>
        مستشارك
      </button>
      <span class="pill">نسخة تجريبية</span>
    </header>
    <main id="view" aria-live="polite"></main>
  </div>
</div>

<script>
/* =====================================================================
   1) DEMO_DATA — بيانات تجريبية فقط (ليست قاعدة قانونية حقيقية).
   لاحقًا يُستبدل هذا الجزء بخدمة KnowledgeService تقرأ من قاعدة المعرفة.
   كل قسم = تعريف + شجرة أسئلة (nodes). كل خيار يحدد السؤال التالي (next).
   خصائص الخيار: t النص، next السؤال التالي، k معلومة تمت الإجابة عنها،
   u غير متأكد، need معلومات مطلوبة إضافية، s جملة للملخص، c تصنيف،
   st خطوات، dc مستندات، urgent استعجال.
   ===================================================================== */
const o = (t, next, p = {}) => ({ t, next: next || null, ...p });
const Q = (q, opts, help = '') => ({ q, help, opts });
const UNSURE = (next, k) => o('لا أعرف / غير متأكد', next, { u: true, k });

const DEMO_DATA = { categories: [

/* ---------------- عمل ---------------- */
{
  id: 'work', label: 'عمل', desc: 'فصل، رواتب، عقود، مستحقات', cls: 'علاقة عمل', start: 'w1',
  kw: ['عمل', 'وظيف', 'فصل', 'مرتب', 'راتب', 'مدير', 'استقال', 'مستحقات', 'موظف', 'صاحب العمل'],
  reqDefs: {
    start: { l: 'تاريخ بداية العمل ومدته', kw: ['منذ', 'بدأت', 'التحقت', 'تعيين', 'سنة', 'سنوات', 'شهر', 'أشهر'] },
    contract: { l: 'نوع عقد العمل (مكتوب أم شفهي، محدد المدة أم غير محدد)', kw: ['عقد'] },
    reason: { l: 'سبب إنهاء الخدمة أو الخلاف تحديدًا', kw: ['فصل', 'استقال', 'إنهاء', 'خصم', 'راتب', 'مرتب', 'مستحقات', 'إنذار'] },
    notice: { l: 'هل يوجد إخطار مكتوب بإنهاء الخدمة؟', kw: ['إخطار', 'خطاب', 'إنذار', 'مكتوب'], tr: ['فصل', 'إنهاء', 'أنهت', 'طرد'] },
    amount: { l: 'قيمة المبالغ المتأخرة وتواريخ استحقاقها', kw: ['جنيه', 'مبلغ', 'شهور'], tr: ['راتب', 'مرتب', 'مستحقات'] },
    docs: { l: 'المستندات المتوفرة لديك (عقد، كشف مرتبات، رسائل)', kw: ['مستند', 'إيصال', 'كشف', 'مفردات', 'إثبات', 'رسائل', 'صور'] }
  },
  baseReq: ['start', 'contract', 'reason', 'docs'],
  steps: [
    'اجمع كل ما يثبت علاقة العمل: العقد، كشوف المرتبات، الرسائل، وأي صور أو إيصالات.',
    'اكتب تسلسلًا زمنيًا مختصرًا بالوقائع وتواريخها وأسماء من حضرها.',
    'احتفظ بنسخ من أي رسائل أو مراسلات مع جهة العمل ولا تحذفها.',
    'قد يفيدك الاستفسار عن الجهة المختصة بشكاوى العمل في منطقتك قبل اتخاذ أي خطوة رسمية.',
    'يُفضّل عرض الموقف على محامٍ متخصص في قضايا العمل قبل التوقيع على أي ورقة أو تسوية.'
  ],
  docs: ['عقد العمل (إن وُجد)', 'كشوف المرتبات أو إيصالات استلام الراتب', 'المراسلات مع جهة العمل (رسائل، بريد إلكتروني)', 'بطاقة الرقم القومي', 'إثبات التأمينات الاجتماعية (إن وُجد)'],
  nodes: {
    w1: Q('ما الذي يصف موقفك الأقرب؟', [
      o('تم إنهاء عملي', 'w2', { k: 'reason', need: ['notice'], c: 'إنهاء خدمة في علاقة عمل', s: 'ذكرت أنه تم إنهاء عملك.' }),
      o('لم أحصل على راتبي أو مستحقاتي', 'w3', { k: 'reason', need: ['amount'], c: 'مستحقات مالية في علاقة عمل', s: 'ذكرت وجود تأخر أو نقص في الراتب أو المستحقات.' }),
      o('أفكر في إنهاء العمل بنفسي', 'w4', { k: 'reason', c: 'إنهاء علاقة عمل بإرادتك', s: 'ذكرت أنك تفكر في إنهاء العمل بنفسك.' }),
      o('خلاف آخر مع جهة العمل', 'w5', { k: 'reason', c: 'خلاف في علاقة عمل', s: 'ذكرت وجود خلاف مع جهة العمل.' })
    ], 'اختر الأقرب حتى لو لم يكن مطابقًا تمامًا.'),
    w2: Q('كيف تم إبلاغك بإنهاء العمل؟', [
      o('بإخطار مكتوب', 'w5', { k: 'notice', s: 'تم إبلاغك بإنهاء العمل كتابةً.' }),
      o('شفهيًا فقط', 'w5', { k: 'notice', s: 'تم إبلاغك بإنهاء العمل شفهيًا فقط.', st: ['اطلب من جهة العمل إخطارًا كتابيًا بقرار الإنهاء وسببه، واحتفظ بدليل الطلب.'] }),
      o('لم أُبلَّغ، ومُنعت من العمل', 'w5', { k: 'notice', urgent: true, s: 'ذكرت أنك مُنعت من العمل دون إبلاغ رسمي.', st: ['وثّق أي محاولة لدخول مكان العمل أو التواصل مع جهة العمل بعد الإنهاء، بالتاريخ والتوقيت.'] })
    ]),
    w3: Q('ما الذي لم تحصل عليه؟', [
      o('الراتب الشهري', 'w5', { s: 'المتأخر لديك هو الراتب الشهري.', st: ['سجّل المبالغ المتأخرة بالشهر والقيمة، وما سبق أن استلمته.'] }),
      o('بدلات أو مكافآت', 'w5', { s: 'المتأخر لديك بدلات أو مكافآت.', st: ['سجّل المبالغ المتأخرة بالشهر والقيمة، وما سبق أن استلمته.'] }),
      o('مستحقات نهاية الخدمة', 'w5', { s: 'المتأخر لديك مستحقات نهاية الخدمة.', st: ['سجّل المبالغ المتأخرة بالشهر والقيمة، وما سبق أن استلمته.'] }),
      o('أكثر من نوع مما سبق', 'w5', { s: 'المتأخر لديك أكثر من نوع من المستحقات.', st: ['سجّل المبالغ المتأخرة بالشهر والقيمة، وما سبق أن استلمته.'] })
    ]),
    w4: Q('هل ما زلت داخل مدة عقد محدد؟', [
      o('نعم، عقدي محدد المدة ولم ينتهِ', 'w5', { s: 'عقدك محدد المدة ولم ينتهِ بعد.', st: ['راجع بنود إنهاء العقد قبل تقديم أي استقالة مكتوبة.'] }),
      o('لا، عقدي غير محدد المدة', 'w5', { s: 'عقدك غير محدد المدة.' }),
      UNSURE('w5')
    ]),
    w5: Q('هل لديك عقد عمل؟', [
      o('نعم، عقد مكتوب', 'w6', { k: 'contract', s: 'يوجد لديك عقد عمل مكتوب.' }),
      o('لا، الاتفاق كان شفهيًا', 'w6', { k: 'contract', s: 'الاتفاق على العمل كان شفهيًا.', dc: ['أي دليل على العمل: رسائل، تحويلات، أسماء زملاء أو شهود'] }),
      UNSURE('w6', 'contract')
    ]),
    w6: Q('كم استمر عملك لدى هذه الجهة تقريبًا؟', [
      o('أقل من سنة', 'w7', { k: 'start', s: 'مدة عملك أقل من سنة.' }),
      o('من سنة إلى خمس سنوات', 'w7', { k: 'start', s: 'مدة عملك بين سنة وخمس سنوات.' }),
      o('أكثر من خمس سنوات', 'w7', { k: 'start', s: 'مدة عملك أكثر من خمس سنوات.' }),
      UNSURE('w7', 'start')
    ]),

const norm = (s) => String(s || '').replace(/[ً-ٰٟـ]/g, '').replace(/[أإآٱ]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه').toLowerCase();
const hasAny = (text, words) => words.some((w) => w && text.includes(norm(w)));
const uniq = (arr) => [...new Set(arr.filter(Boolean))];

const KnowledgeService = {
  categories: () => DEMO_DATA.categories,
  category: (id) => DEMO_DATA.categories.find((c) => c.id === id),
  node: (cat, nodeId) => cat.nodes[nodeId],
  // أطول مسار متبقٍ من سؤال معين (لشريط التقدم)
  depth(cat, nodeId, memo = {}) {
    if (!nodeId) return 0;
    if (memo[nodeId] !== undefined) return memo[nodeId];
    const nxt = cat.nodes[nodeId].opts.map((op) => op.next);
    return (memo[nodeId] = 1 + Math.max(0, ...nxt.map((n) => this.depth(cat, n, memo))));
  }
};

const AnalysisService = {
  async analyzeGuided({ catId, answers }) {
    const cat = KnowledgeService.category(catId);
    const opts = answers.map((a) => cat.nodes[a.nodeId].opts[a.optIdx]);
    const need = new Set(cat.baseReq);
    const answered = new Set();
    const unsure = new Set();
    opts.forEach((op) => {
      (op.need || []).forEach((k) => need.add(k));
      if (op.k) (op.u ? unsure : answered).add(op.k);
    });
    const missing = Object.keys(cat.reqDefs)
      .filter((k) => need.has(k) && !answered.has(k))
      .map((k) => cat.reqDefs[k].l + (unsure.has(k) ? ' (ذكرتَ أنك غير متأكد أو لا تملكه)' : ''));
    const cs = opts.map((op) => op.c).filter(Boolean);
    const main = cs.length ? cs[cs.length - 1] : cat.cls;
    const urgent = cat.highRisk ? 'high' : opts.some((op) => op.urgent) ? 'time' : null;
    return {
      mode: 'guided',
      summary: [`اخترتَ قسم «${cat.label}».`, ...opts.map((op) => op.s)].filter(Boolean),
      classification: { text: `يبدو أن المسألة تتعلق ب${main}.`, note: `ضمن مجال «${cat.label}».` },
      missing,
      steps: uniq([...opts.flatMap((op) => op.st || []), ...cat.steps]).slice(0, 8),
      docs: uniq([...cat.docs, ...opts.flatMap((op) => op.dc || [])]),
      urgent
    };
  },

  async analyzeText(text) {
    const t = norm(text);
    const all = KnowledgeService.categories();
    const scored = all.filter((c) => c.id !== 'other')
      .map((c) => ({ c, score: c.kw.reduce((n, w) => n + (t.includes(norm(w)) ? 1 : 0), 0) }))
      .sort((a, b) => b.score - a.score);
    const unclear = scored[0].score === 0;
    const cat = unclear ? KnowledgeService.category('other') : scored[0].c;
    const second = !unclear && scored[1].score > 0 && scored[1].score >= scored[0].score * 0.6 ? scored[1].c : null;
    const found = Object.keys(cat.reqDefs).filter((k) => cat.reqDefs[k].kw.length === 0 || hasAny(t, cat.reqDefs[k].kw));
    const need = new Set(cat.baseReq);
    Object.keys(cat.reqDefs).forEach((k) => { const d = cat.reqDefs[k]; if (d.tr && hasAny(t, d.tr)) need.add(k); });
    const missing = Object.keys(cat.reqDefs).filter((k) => need.has(k) && !found.includes(k)).map((k) => cat.reqDefs[k].l);
    const signals = found.filter((k) => cat.reqDefs[k].kw.length).map((k) => cat.reqDefs[k].l.replace(/\s*\(.*?\)/g, ''));
    const words = text.trim().split(/\s+/).length;
    const rush = hasAny(t, ['قبض', 'حبس', 'إنذار', 'إخلاء', 'مهلة', 'جلسة', 'استدعاء', 'إزالة', 'تهديد', 'ضرب', 'عنف', 'خطر']);
    return {
      mode: 'text',
      summary: [
        `وصفتَ موقفك في نحو ${words} كلمة.`,
        signals.length ? `رصد النظام في نصك إشارات إلى: ${signals.join('، ')}.` : 'لم يرصد النظام تفاصيل محددة في نصك بعد.'
      ],
      excerpt: text.trim().slice(0, 420) + (text.trim().length > 420 ? '…' : ''),
      classification: unclear
        ? { text: 'لم يتضح التصنيف بعد؛ قد تكون المسألة خارج الأقسام المعروفة أو تحتاج مزيدًا من التفاصيل.', note: '' }
        : { text: `يبدو أن المسألة تتعلق ب${cat.cls}.`, note: `ضمن مجال «${cat.label}».` + (second ? ` وقد تتصل أيضًا بمجال «${second.label}».` : '') },
      missing,
      steps: cat.steps,
      docs: cat.docs,
      urgent: cat.highRisk ? 'high' : rush ? 'time' : null
    };
  }
};

        <h2>تحديثات موصى بإدراجها</h2>
        <p>هذه العناصر أضيفت إلى واجهة المكتبة كبيانات مرجعية داخل النسخة التجريبية. لا يعني ذلك أن التطبيق متصل تلقائيًا بمصدر تشريعي حي أو أن النصوص الأصلية نُسخت إلى قاعدة بيانات.</p>
      </div>

      ${updates}

      <div class="sec">
        <h2>سياسة تحديث المكتبة</h2>
        <ul>
          <li>المصدر الأول: الجريدة الرسمية والوقائع المصرية والمصادر القضائية أو النقابية الرسمية عند توافرها.</li>
          <li>تسجيل رقم القانون أو القرار أو الطعن، وتاريخ النشر، وتاريخ النفاذ إن وجد.</li>
          <li>تحديد النص السابق الذي عُدّل أو أُلغي، وعدم عرض النص القديم باعتباره ساريًا.</li>
          <li>تمييز «مشروع قانون» عن «قانون صادر» وعن «قانون نافذ».</li>
          <li>إذا تعذر التحقق من الأصل الرسمي، يظهر ذلك للمستخدم بدل تخمين المعلومة.</li>
        </ul>
      </div>

      <div class="sec">
        <h2>أحكام النقض</h2>
        <p>سيُعرض رقم الطعن والدائرة وتاريخ الجلسة والمبدأ القانوني ورابط الحكم أو مصدر نشره عند توافره من مصدر قضائي يمكن التحقق منه.</p>
        <p class="sub">في هذا التحديث لم تتم إضافة حكم نقض جديد لأنني لم أتحقق من حكم رسمي متاح بما يكفي لإدراجه دون مخاطرة بالخطأ.</p>
      </div>

      <div class="notice">الأولوية للمصادر الرسمية. التحديثات المعروضة هنا توصيات إدراج داخل «مستشارك»، وليست استشارة قانونية ولا بديلًا عن النص الرسمي أو المحامي المختص.</div>
    </section>`;
  },
  lawyers() {
    return `<section class="view">${backBtn('home')}<h1 data-focus>دليل المحامين</h1><p class="lead">ابحث مستقبلًا عن محامٍ بحسب التخصص والمحافظة ونطاق العمل.</p>
      <div class="sec"><h2>كيف سيتم الترشيح؟</h2><ul><li>التخصص القانوني المرتبط بالمشكلة.</li><li>المحافظة أو المنطقة التي يفضلها طالب الخدمة.</li><li>بيانات القيد والتواصل بعد التحقق وموافقة المحامي على النشر.</li><li>إظهار معايير الترشيح بوضوح، دون ترتيب مدفوع خفي.</li></ul></div>
      <div class="notice">لا توجد حاليًا قائمة محامين موثقة أو أرقام تواصل معتمدة داخل هذه النسخة. لن نختلق أسماء أو أرقامًا.</div></section>`;
  },

  question() {
    const cat = KnowledgeService.category(S.catId);
    const node = KnowledgeService.node(cat, S.nodeId);
    const n = S.answers.length;
    const total = 1 + n + KnowledgeService.depth(cat, S.nodeId);
    const current = n + 2;
    const pct = Math.round(((current - 1) / total) * 100);
    const opts = node.opts.map((op, i) =>
      `<button class="btn opt ${S.pendingOpt === i ? 'sel' : ''}" type="button" data-action="answer" data-idx="${i}" aria-pressed="${S.pendingOpt === i}"><span class="dot"></span><span>${esc(op.t)}</span></button>`).join('');
    return `<section class="view">
      ${backBtn('q-back')}
      <div class="progress">
        <div class="progress-meta"><span>قسم «${esc(cat.label)}»</span><span>الخطوة ${current} من حوالي ${total}</span></div>
        <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}" aria-label="التقدم في الأسئلة"><div class="fill" style="width:${pct}%"></div></div>
      </div>
      <div class="qcard">
        <h2 data-focus>${esc(node.q)}</h2>
        ${node.help ? `<p class="help">${esc(node.help)}</p>` : ''}
        <div class="stack" role="group" aria-label="خيارات الإجابة">${opts}</div>
      </div>
      <div class="actions"><button class="btn btn-primary" type="button" data-action="next-question" ${S.pendingOpt === null ? 'disabled' : ''}>التالي</button></div>
    </section>`;
  },

  free() {
    return `<section class="view">
      ${backBtn('home')}
      <div class="stack">
        <h1 data-focus>اكتب مشكلتك</h1>
        <p class="lead">احكِ ما حدث بكلماتك. كلما ذكرت تواريخ وأطرافًا ومستندات، كان الفهم أفضل.</p>
      </div>
      <details class="tips">
        <summary>ماذا أكتب؟</summary>
        <ul>
          <li>ماذا حدث ومتى بدأ الموضوع؟</li>
          <li>من الأطراف المعنية وما علاقتك بهم؟</li>
          <li>ما الأوراق أو الرسائل التي لديك؟</li>
          <li>ماذا تريد أن تصل إليه؟</li>
        </ul>
      </details>
      <div class="stack">
        <label for="story" style="font-weight:600">قصتك</label>
        <textarea id="story" placeholder="مثال: أعمل في شركة منذ ثلاث سنوات، وأخبرني المدير شفهيًا أنني مفصول، ولم أستلم راتب الشهر الماضي...">${esc(S.text)}</textarea>
        <div class="counter"><span id="story-count"></span><span id="story-err" class="err" role="alert"></span></div>
        <button class="btn btn-primary" type="button" data-action="analyze-text"><span>حلّل موقفي</span>${ARROW}</button>
      </div>
      <button class="link" type="button" data-action="start-guided">أفضّل الإجابة عن أسئلة موجّهة</button>
    </section>`;
  },

  loading() {
    return `<section class="view"><div class="loading" role="status"><div class="spin"></div><p data-focus tabindex="-1">جارٍ تحليل موقفك...</p></div></section>`;
  },

  result() {
    const r = S.result;
    const li = (a) => a.map((x) => `<li>${esc(x)}</li>`).join('');
    const urgentMsg = r.urgent === 'high'
      ? 'هذه المسألة قد تكون عالية الخطورة. يُنصح بالتواصل مع محامٍ مؤهل في أقرب وقت ممكن، وعدم اتخاذ أي خطوة رسمية قبل فهم موقفك.'
      : r.urgent === 'time'
        ? 'بعض ما ذكرته يشير إلى أن الوقت قد يكون مهمًا (مواعيد أو إجراءات قريبة). لا تؤجل عرض الموقف على محامٍ مؤهل.'
        : '';
    const demoMsg = r.mode === 'guided'
      ? 'هذه النتيجة مبنية على إجاباتك وعلى بيانات تجريبية داخل التطبيق، وليست حكمًا قانونيًا.'
      : 'هذا تحليل تجريبي يعتمد على كلمات مفتاحية في نصك فقط، وليس ذكاءً اصطناعيًا ولا حكمًا قانونيًا.';
    const docs = r.docs.map((d, i) =>
      `<label class="check"><input type="checkbox" data-doc="${i}" ${S.checked[d] ? 'checked' : ''}><span>${esc(d)}</span></label>`).join('');
    const answerDetails = (r.answerDetails || []).map(a => `<div class="answer-item"><strong>${esc(a.question)}</strong><span>${esc(a.answer)}</span></div>`).join('');
    const firstStep = r.steps && r.steps.length ? r.steps[0] : 'استكمل المعلومات الناقصة قبل اتخاذ إجراء.';
    return `<section class="view">
      <div class="stack">
        <h1 data-focus>نتيجة التحليل الأولي</h1>
        <p class="demo-note">${demoMsg}</p>
        ${urgentMsg ? `<p class="notice" role="alert"><strong>تنبيه:</strong> ${urgentMsg}</p>` : ''}
      </div>

      <section class="summary-highlight" aria-labelledby="h-quick">
        <h2 id="h-quick">الخلاصة في دقيقة</h2>
        <p><strong>الموضوع:</strong> ${esc(r.classification.text)}</p>
        <p><strong>ما ينبغي فعله أولًا:</strong> ${esc(firstStep)}</p>
        <p><strong>المعلومات المطلوب استكمالها:</strong> ${r.missing.length ? `هناك ${r.missing.length} نقطة تحتاج إلى توضيح.` : 'لا تظهر نقاط أساسية ناقصة في هذه المرحلة.'}</p>
      </section>

      <section class="sec" aria-labelledby="h-sum">
        <h2 id="h-sum">ملخص موقفك</h2>
        <ul>${li(r.summary)}</ul>
        ${r.excerpt ? `<div class="quote">${esc(r.excerpt)}</div>` : ''}
      </section>

      ${answerDetails ? `<section class="sec" aria-labelledby="h-answers"><h2 id="h-answers">إجاباتك كما سجلتها</h2><div class="answer-list">${answerDetails}</div></section>` : ''}

      <section class="sec" aria-labelledby="h-cls">
        <h2 id="h-cls">التصنيف القانوني المحتمل</h2>
        <p class="class-main">${esc(r.classification.text)}</p>
        ${r.classification.note ? `<p>${esc(r.classification.note)}</p>` : ''}
        <p class="sub">هذا تصنيف مبدئي وقد يتغير بعد استكمال المعلومات.</p>
      </section>

      <section class="sec" aria-labelledby="h-mis">
        <h2 id="h-mis">المعلومات الناقصة</h2>
        ${r.missing.length
          ? `<p class="sub">كلما استكملت هذه النقاط، أصبح الفهم أدق:</p><ul class="missing">${li(r.missing)}</ul>`
          : '<p>لا توجد نقاط ناقصة ظاهرة بناءً على إجاباتك، لكن التفاصيل الدقيقة تحتاج مراجعة متخصص.</p>'}
      </section>

      <section class="sec" aria-labelledby="h-stp">
        <h2 id="h-stp">الخطوات الأولية المحتملة</h2>
        <p class="sub">خطوات عامة قد تفيدك، وليست حلًا قانونيًا نهائيًا لحالتك.</p>
        <ol>${li(r.steps)}</ol>
      </section>

      <section class="sec" aria-labelledby="h-doc">
        <h2 id="h-doc">المستندات المهمة</h2>
        <p class="sub">علّم على ما لديك فعلًا. <span id="doc-count"></span></p>
        <div class="checks">${docs}</div>
      </section>

      <section class="disclaimer" aria-labelledby="h-dis">
        <h2 id="h-dis">تنبيه قانوني</h2>
        <p>المعلومات المعروضة هنا معلومات أولية وعامة، وليست بديلًا عن استشارة محامٍ مؤهل. لا تعتمد عليها وحدها في اتخاذ قرار، خصوصًا في المسائل العاجلة أو عالية الخطورة مثل المواعيد القريبة أو الاتهامات الجنائية أو الإخلاء.</p>
        <p>هذه نسخة تجريبية تستخدم بيانات توضيحية، وليست قاعدة قانونية حقيقية.</p>
      </section>

      <div class="actions">
        <button class="btn btn-inline" type="button" data-action="print-summary">طباعة / حفظ الملخص PDF</button>
        <button class="btn btn-inline" type="button" data-action="result-edit">${r.mode === 'guided' ? 'تعديل إجاباتي' : 'تعديل النص'}</button>
        <button class="btn btn-primary btn-inline" type="button" data-action="restart">ابدأ استشارة جديدة</button>
      </div>
    </section>`;
  }
};

function render() {
  $view.innerHTML = views[S.view]();
  const h = $view.querySelector('[data-focus]');
  if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  window.scrollTo({ top: 0 });
  if (S.view === 'free') updateCounter();
  if (S.view === 'result') updateDocCount();
}

function go(view) { S.view = view; render(); }

function updateCounter() {
  const el = document.getElementById('story-count');
  if (!el) return;
  const len = S.text.trim().length;
  el.textContent = len ? `${len} حرفًا` : 'ابدأ الكتابة...';
}
function updateDocCount() {
  const el = document.getElementById('doc-count');
  if (!el) return;
  const have = S.result.docs.filter((d) => S.checked[d]).length;
  el.textContent = `لديك ${have} من ${S.result.docs.length}.`;
}

async function finishGuided() {
  S.view = 'loading'; render();
  const [res] = await Promise.all([
    AnalysisService.analyzeGuided({ catId: S.catId, answers: S.answers }),
    new Promise((r) => setTimeout(r, 500))
  ]);
  const cat = KnowledgeService.category(S.catId);
  res.answerDetails = S.answers.map(a => ({ question: cat.nodes[a.nodeId]?.q || 'سؤال', answer: cat.nodes[a.nodeId]?.opts[a.optIdx]?.t || 'إجابة' }));
  S.result = res; S.checked = {}; go('result');
}

async function runText() {
  const err = document.getElementById('story-err');
  if (S.text.trim().length < 25) { err.textContent = 'اكتب بضع جمل على الأقل (٢٥ حرفًا) ليتمكن النظام من فهم موقفك.'; return; }
  S.view = 'loading'; render();
  const [res] = await Promise.all([AnalysisService.analyzeText(S.text), new Promise((r) => setTimeout(r, 700))]);
  S.result = res; S.checked = {}; go('result');
}

const actions = {
  home() { S.catId = null; S.nodeId = null; S.answers = []; S.pendingOpt = null; go('welcome'); },
  library() { go('library'); },
  lawyers() { go('lawyers'); },
  'search-home'() { const q = document.getElementById('home-search')?.value.trim() || ''; if (!q) { go('categories'); return; } S.text = q; go('free'); },
  common(t) { S.text = t.dataset.text || ''; const cat = KnowledgeService.category(t.dataset.cat); S.catId = cat.id; S.nodeId = cat.start; S.answers = []; S.pendingOpt = null; go('question'); },
  'start-guided'() { S.answers = []; S.pendingOpt = null; go('categories'); },
  'start-free'() { go('free'); },
  'pick-cat'(t) {
    const cat = KnowledgeService.category(t.dataset.id);
    S.catId = cat.id; S.nodeId = cat.start; S.answers = []; S.pendingOpt = null; go('question');
  },
  answer(t) {
    if (S.busy) return;
    S.pendingOpt = Number(t.dataset.idx);
    render();
  },
  'next-question'() {
    if (S.busy || S.pendingOpt === null) return;
    const cat = KnowledgeService.category(S.catId);
    const idx = S.pendingOpt;
    const op = cat.nodes[S.nodeId].opts[idx];
    S.answers.push({ nodeId: S.nodeId, optIdx: idx });
    S.pendingOpt = null;
    if (op.next) { S.nodeId = op.next; render(); } else finishGuided();
  },
  'q-back'() {
    if (S.pendingOpt !== null) { S.pendingOpt = null; render(); return; }
    if (S.answers.length) S.nodeId = S.answers.pop().nodeId;
    else { go('categories'); return; }
    S.pendingOpt = null;
    render();
  },
  'analyze-text'() { runText(); },
  'print-summary'() { window.print(); },
  'result-edit'() {
    if (S.result.mode === 'guided') { S.nodeId = S.answers.pop().nodeId; S.pendingOpt = null; go('question'); } else go('free');
  },
  restart() { S.catId = null; S.nodeId = null; S.answers = []; S.pendingOpt = null; S.text = ''; S.result = null; go('welcome'); }
};

document.getElementById('app').addEventListener('click', (e) => {
  const t = e.target.closest('[data-action]');
  if (t && actions[t.dataset.action]) actions[t.dataset.action](t);
});
document.getElementById('app').addEventListener('input', (e) => {
  if (e.target.id === 'home-search') {
    const q = norm(e.target.value);
    document.querySelectorAll('#home-categories [data-id]').forEach(b => { b.hidden = !!q && !norm(b.textContent).includes(q); });
  }
  if (e.target.id === 'story') {
    S.text = e.target.value; updateCounter();
    const err = document.getElementById('story-err'); if (err) err.textContent = '';
  }
});
document.getElementById('app').addEventListener('change', (e) => {
  if (e.target.matches('[data-doc]')) {
    S.checked[S.result.docs[Number(e.target.dataset.doc)]] = e.target.checked; updateDocCount();
  }
});

render();
</script>


<script>
// PWA: register the offline app shell when served over HTTPS or localhost.
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch((error) => {
      console.warn('تعذر تفعيل وضع التطبيق:', error);
    });
  });
}
</script>
</body></html>
